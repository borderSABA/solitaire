= document.createElement(\"div\");\n    frame.className = \"board-frame\";\n    outer.appendChild(frame);\n    // --- 上バー（共通コンポーネント） ---\n    const topBar = buildTopBar(session, {\n        statusText: ui.statusText,\n        readyForFinish,\n        finishing,\n        gameCleared,\n    }, {\n        onBackToMenu: () => handlers.onBackToMenu(),\n        onNewGameClick: () => handlers.onNewGameClick(),\n        onUndoClick: () => handlers.onUndoClick(),\n        onFinishClick: () => handlers.onFinishClick(), // FreeCellはFINISH対応\n    });\n    frame.appendChild(topBar);\n    // --- 盤面本体 ---\n    const board = document.createElement(\"div\");\n    board.className = \"board freecell-board\";\n    const topRow = document.createElement(\"div\");\n    topRow.className = \"board-top-row\";\n    // フリーセル側(左ブロック)\n    const freecellGroup = document.createElement(\"div\");\n    freecellGroup.className = \"freecell-group\";\n    state.freecells.forEach((c, i) => {\n        const slot = document.createElement(\"div\");\n        slot.className = \"slot freecell-slot-area\";\n        slot.dataset.drop = `freecell-${i}`;\n        // クリック＝移動先候補通知\n        slot.addEventListener(\"click\", (ev) => {\n            ev.stopPropagation();\n            lastTapTime = 0;\n            lastTapSrc = null;\n            handlers.onClickDestination({\n                destType: \"freecell\",\n                freecellIndex: i,\n            });\n        });\n        if (c) {\n            const canDrag = !!movableMap.freecells[i];\n            const hl = !!highlightMap.freecells[i];\n            const srcRef = canDrag\n                ? { srcType: \"freecell\", freecellIndex: i }\n                : null;\n            const cardDiv = createCardDiv(c, 0, canDrag, hl, srcRef, \n            /*allowAutoToFound*/ true, handlers);\n            freecellGroup.appendChild(slot);\n            slot.appendChild(cardDiv);\n        }\n        else {\n            freecellGroup.appendChild(slot);\n        }\n    });\n    topRow.appendChild(freecellGroup);\n    // foundation側(右ブロック)\n    const foundationGroup = document.createElement(\"div\");\n    foundationGroup.className = \"foundation-group\";\n    state.foundations.forEach((pile, fIndex) => {\n        const slot = document.createElement(\"div\");\n        slot.className = \"slot foundation-slot-area\";\n        slot.dataset.drop = `foundation-${fIndex}`;\n        slot.addEventListener(\"click\", (ev) => {\n            ev.stopPropagation();\n            lastTapTime = 0;\n            lastTapSrc = null;\n            handlers.onClickDestination({\n                destType: \"foundation\",\n                foundationIndex: fIndex,\n            });\n        });\n        const topCard = pile.length > 0 ? pile[pile.length - 1] : null;\n        if (topCard) {\n            const canDrag = !!movableMap.foundations[fIndex];\n            const hl = !!highlightMap.foundations[fIndex];\n            const srcRef = canDrag\n                ? { srcType: \"foundation\", foundationIndex: fIndex }\n                : null;\n            const cardDiv = createCardDiv(topCard, 0, canDrag, hl, srcRef, \n            /*allowAutoToFound*/ false, handlers);\n            cardDiv.classList.add(\"foundation-card\");\n            foundationGroup.appendChild(slot);\n            slot.appendChild(cardDiv);\n        }\n        else {\n            foundationGroup.appendChild(slot);\n        }\n    });\n    topRow.appendChild(foundationGroup);\n    board.appendChild(topRow);\n    // 列\n    const columnsArea = document.createElement(\"div\");\n    columnsArea.className = \"columns-area\";\n    // CSS変数から列内の縦間隔(px)を取得（既定 20px）\n    const freecellGap = cssPxNumber(\"--freecell-gap\", 20);\n    state.columns.forEach((col, colIndex) => {\n        const colStack = document.createElement(\"div\");\n        colStack.className = \"column-stack\";\n        colStack.dataset.drop = `column-${colIndex}`;\n        colStack.addEventListener(\"click\", (ev) => {\n            ev.stopPropagation();\n            lastTapTime = 0;\n            lastTapSrc = null;\n            handlers.onClickDestination({\n                destType: \"column\",\n                colIndex,\n            });\n        });\n        col.forEach((card, idxInCol) => {\n            const canDragHead = !!(movableMap.columns[colIndex] &&\n                movableMap.columns[colIndex][idxInCol]);\n            const hl = !!(highlightMap.columns[colIndex] &&\n                highlightMap.columns[colIndex][idxInCol]);\n            const srcRef = canDragHead\n                ? {\n                    srcType: \"column\",\n                    colIndex,\n                    startIndex: idxInCol,\n                }\n                : null;\n            const cardDiv = createCardDiv(card, idxInCol * freecellGap, canDragHead, hl, srcRef, \n            /*allowAutoToFound*/ true, handlers, () => {\n                // canDragHead=false のとき用：列タップで「動かせる束の先頭」へスナップ\n                handlers.onColumnCardTap(colIndex, idxInCol);\n            });\n            colStack.appendChild(cardDiv);\n        });\n        columnsArea.appendChild(colStack);\n    });\n    board.appendChild(columnsArea);\n    // 盤面の何も無い場所タップで選択解除（ついでにダブルタップ状態もリセット）\n    board.addEventListener(\"click\", () => {\n        lastTapTime = 0;\n        lastTapSrc = null;\n        handlers.onEmptyBoardClick();\n    });\n    // board も frame 内に収める\n    frame.appendChild(board);\n    // --- NEW GAMEメニュー用オーバーレイ（共通） ---\n    if (ui.showNewGameMenu && !gameCleared) {\n        outer.appendChild(buildNewGameOverlay({\n            onChooseNewGameOption: handlers.onChooseNewGameOption,\n        }));\n    }\n    // --- クリア時のオーバーレイ（共通） ---\n    if (gameCleared) {\n        outer.appendChild(buildClearOverlay({\n            onClearToMenuClick: handlers.onClearToMenuClick,\n            onClearReplayClick: handlers.onClearReplayClick,\n        }, { titleText: \"CLEAR!\", pulse: true }));\n    }\n    root.appendChild(outer);\n}\n","deps":{"__SOLDEP_0_578cde42__":"src/ui/commonUI.js","__SOLDEP_1_65f4b1ab__":"src/ui/cardText.js"}},"core/klondike/rules.js":{"src":"// core/klondike/rules.ts\n// スート→foundation配列index\n// FreeCellと合わせて [H=0, D=1, C=2, S=3] で固定\nexport function suitToFoundationIndexK(suit) {\n    switch (suit) {\n        case \"H\": return 0;\n        case \"D\": return 1;\n        case \"C\": return 2;\n        case \"S\": return 3;\n    }\n}\n// カード色（赤/黒）\nfunction cardColor(card) {\n    return (card.suit === \"H\" || card.suit === \"D\") ? \"red\" : \"black\";\n}\n// ディープコピー\nfunction cloneState(st) {\n    return {\n        stock: st.stock.map(c => ({ ...c })),\n        waste: st.waste.map(c => ({ ...c })),\n        foundations: st.foundations.map(pile => pile.map(c => ({ ...c }))),\n        tableaus: st.tableaus.map(col => col.map(c => ({ ...c }))),\n        drawCount: st.drawCount\n    };\n}\n// tableau内部がちゃんと交互色・降順になってるかチェック\n// (cardIndex以降がすべて表向きで、rankが1ずつ下がり、色が交互)\nfunction isValidMovableTail(col, cardIndex) {\n    for (let i = cardIndex; i < col.length; i++) {\n        if (!col[i].faceUp)\n            return false;\n    }\n    for (let i = cardIndex; i < col.length - 1; i++) {\n        const a = col[i];\n        const b = col[i + 1];\n        if (!a.faceUp || !b.faceUp)\n            return false;\n        if (a.rank !== b.rank + 1)\n            return false;\n        if (cardColor(a) === cardColor(b))\n            return false;\n    }\n    return true;\n}\n// tableauから cardIndex 以降を「まとめて動かせる束」として取り出す\nexport function getMovableStackFromTableau(state, colIndex, cardIndex) {\n    const col = state.tableaus[colIndex];\n    if (!col)\n        return [];\n    if (cardIndex < 0 || cardIndex >= col.length)\n        return [];\n    if (!isValidMovableTail(col, cardIndex))\n        return [];\n    return col.slice(cardIndex);\n}\n// tableaus[colIndex] の末尾カードを1枚だけ foundation に置けるか\nfunction canMoveCardToFoundation(card, pile) {\n    if (!pile.length) {\n        // 空foundationには A しか乗らない\n        return card.rank === 1;\n    }\n    const top = pile[pile.length - 1];\n    return (card.suit === top.suit) && (card.rank === top.rank + 1);\n}\n// tableau の先頭になるカード stackFirst を destCol に置けるか\n// 空列には K しか置けない\nfunction canPlaceOnTableauTop(stackFirst, destCol) {\n    if (!destCol.length) {\n        return stackFirst.rank === 13; // K限定\n    }\n    const top = destCol[destCol.length - 1];\n    if (!top.faceUp)\n        return false;\n    if (cardColor(stackFirst) === cardColor(top))\n        return false;\n    // 置くカードは top.rank - 1\n    return stackFirst.rank === top.rank - 1;\n}\n// -------------------------------------------------\n// 山札クリック時\n// - stock から drawCount 枚めくって waste に表で積む\n// - stock が空のときは waste を全部裏に戻して stock に再セット\n// -------------------------------------------------\nexport function drawFromStockKlondike(state) {\n    const ns = cloneState(state);\n    if (ns.stock.length > 0) {\n        // 通常ドロー\n        const n = Math.min(ns.drawCount, ns.stock.length);\n        for (let i = 0; i < n; i++) {\n            const card = ns.stock.pop();\n            card.faceUp = true;\n            ns.waste.push(card);\n        }\n        return ns;\n    }\n    // stock が空 → waste を全部裏に戻してstockへ戻す（無限リサイクル）\n    if (ns.waste.length > 0) {\n        while (ns.waste.length > 0) {\n            const card = ns.waste.pop();\n            card.faceUp = false;\n            ns.stock.push(card);\n        }\n    }\n    return ns;\n}\n// クリア判定： foundation が全部13枚積まれているか\nfunction isCleared(ns) {\n    for (let i = 0; i < ns.foundations.length; i++) {\n        if (ns.foundations[i].length !== 13)\n            return false;\n    }\n    return true;\n}\n// -------------------------------------------------\n// 1手の移動をまとめて適用\n// fromRef → destRef\n// -------------------------------------------------\nexport function applyMoveBundleKlondike(state, fromRef, destRef, _turnIndex) {\n    const ns = cloneState(state);\n    // まず移動対象カード束を取り出す\n    let movingCards = [];\n    if (fromRef.type === \"waste\") {\n        if (!ns.waste.length) {\n            return { ok: false, reason: \"wasteが空\" };\n        }\n        const top = ns.waste[ns.waste.length - 1];\n        if (!top.faceUp) {\n            return { ok: false, reason: \"wasteが裏\" };\n        }\n        movingCards = [top];\n    }\n    else if (fromRef.type === \"foundation\") {\n        const pile = ns.foundations[fromRef.foundationIndex];\n        if (!pile.length) {\n            return { ok: false, reason: \"foundationが空\" };\n        }\n        // foundation→tableauには1枚だけ戻すことを許す\n        const top = pile[pile.length - 1];\n        movingCards = [top];\n    }\n    else {\n        // tableau\n        const col = ns.tableaus[fromRef.colIndex];\n        if (!col)\n            return { ok: false, reason: \"bad tableau col\" };\n        if (fromRef.cardIndex < 0 || fromRef.cardIndex >= col.length) {\n            return { ok: false, reason: \"bad cardIndex\" };\n        }\n        // まとめて持てる束の確認\n        const stack = getMovableStackFromTableau(ns, fromRef.colIndex, fromRef.cardIndex);\n        if (!stack.length) {\n            return { ok: false, reason: \"その位置からは動かせない\" };\n        }\n        movingCards = stack;\n    }\n    // -------------------------------------------------\n    // 行き先が foundation\n    // -------------------------------------------------\n    if (destRef.type === \"foundation\") {\n        const fIdx = destRef.foundationIndex;\n        if (movingCards.length !== 1) {\n            return { ok: false, reason: \"foundationへは1枚のみ\" };\n        }\n        const card = movingCards[0];\n        const fPile = ns.foundations[fIdx];\n        if (!canMoveCardToFoundation(card, fPile)) {\n            return { ok: false, reason: \"foundationに置けない\" };\n        }\n        // 元からカードを外す\n        if (fromRef.type === \"waste\") {\n            ns.waste.pop();\n        }\n        else if (fromRef.type === \"foundation\") {\n            // foundation→foundation は許さない\n            return { ok: false, reason: \"foundation同士は不可\" };\n        }\n        else {\n            // tableauの場合\n            ns.tableaus[fromRef.colIndex] = ns.tableaus[fromRef.colIndex].slice(0, fromRef.cardIndex);\n            // めくる\n            const leftCol = ns.tableaus[fromRef.colIndex];\n            if (leftCol.length > 0) {\n                leftCol[leftCol.length - 1].faceUp = true;\n            }\n        }\n        fPile.push(card);\n        return {\n            ok: true,\n            newState: ns,\n            logEntry: { type: \"move-to-foundation\", card },\n            cleared: isCleared(ns)\n        };\n    }\n    // -------------------------------------------------\n    // 行き先が tableau\n    // -------------------------------------------------\n    if (destRef.type === \"tableau\") {\n        const dstCol = ns.tableaus[destRef.colIndex];\n        if (!dstCol) {\n            return { ok: false, reason: \"bad dst tableau\" };\n        }\n        const firstMoving = movingCards[0];\n        if (!canPlaceOnTableauTop(firstMoving, dstCol)) {\n            return { ok: false, reason: \"tableauに置けない\" };\n        }\n        // 元から束を削る\n        if (fromRef.type === \"waste\") {\n            ns.waste.pop();\n        }\n        else if (fromRef.type === \"foundation\") {\n            ns.foundations[fromRef.foundationIndex].pop();\n        }\n        else {\n            // tableau→tableau\n            ns.tableaus[fromRef.colIndex] = ns.tableaus[fromRef.colIndex].slice(0, fromRef.cardIndex);\n            // 残った列の末尾を表向きに\n            const leftCol = ns.tableaus[fromRef.colIndex];\n            if (leftCol.length > 0) {\n                leftCol[leftCol.length - 1].faceUp = true;\n            }\n        }\n        // 置く\n        dstCol.push(...movingCards);\n        return {\n            ok: true,\n            newState: ns,\n            logEntry: { type: \"move-to-tableau\", cards: movingCards },\n            cleared: isCleared(ns)\n        };\n    }\n    return { ok: false, reason: \"unknown dest\" };\n}\n// Klondike のファウンデーションにこのカードを置けるか？\n// foundationIndexOverride が渡された場合はそのファウンデーションだけを対象に判定\n// 省略時はカードのスートから自動で置き先(♥,♦,♣,♠)を決めます。\nexport function canPlaceOnFoundation_K(state, card, foundationIndexOverride) {\n    // まず置き先の山を決める\n    const targetIndex = foundationIndexOverride ?? suitToFoundationIndexK(card.suit);\n    const pile = state.foundations[targetIndex];\n    if (!pile)\n        return false;\n    // まだ1枚も置かれていない場合は、そのカードがA(=1)なら置ける\n    if (pile.length === 0) {\n        return card.rank === 1;\n    }\n    // すでにカードがある場合は\n    // ・同じスートであること\n    // ・ランクがちょうど +1 であること\n    const top = pile[pile.length - 1];\n    // top と同じスートじゃないとダメ\n    if (top.suit !== card.suit)\n        return false;\n    // 例: pileの一番上が 5 なら 次は 6 だけOK\n    return card.rank === top.rank + 1;\n}\n","deps":{}},"src/ui/renderKlondikeScreen.js":{"src":"import { buildTopBar, buildNewGameOverlay, buildClearOverlay } from \"__SOLDEP_0_af1c88d7__\";\nimport { rankToLabel, suitGlyph, cardCssClassBySuit } from \"__SOLDEP_1_e650716__\";\n// ========== CSS変数ヘルパ ==========\n/** CSS変数(px)を数値として取得（失敗時は fallback） */\nfunction cssPxNumber(varName, fallback) {\n    const v = getComputedStyle(document.documentElement)\n        .getPropertyValue(varName)\n        .trim();\n    const m = v.match(/^(-?\\d+(?:\\.\\d+)?)px$/);\n    return m ? parseFloat(m[1]) : fallback;\n}\n/** CSS変数(単位なしの number)を取得（失敗時は fallback） */\nfunction cssNumber(varName, fallback) {\n    const v = getComputedStyle(document.documentElement)\n        .getPropertyValue(varName)\n        .trim();\n    const n = parseFloat(v);\n    return Number.isFinite(n) ? n : fallback;\n}\n// ========== ダブルクリック / ダブルタップ検出（グローバル共有） ==========\nlet lastTapTime = 0;\nlet lastTapSrc = null;\nfunction sameSrc(a, b) {\n    if (!a || !b)\n        return false;\n    if (a.srcType !== b.srcType)\n        return false;\n    if (a.srcType === \"tableau\" && b.srcType === \"tableau\") {\n        // 列は cardIndex を無視：途中→ヘッドの連続クリックでも同一列とみなす\n        return a.colIndex === b.colIndex;\n    }\n    if (a.srcType === \"waste\" && b.srcType === \"waste\")\n        return true;\n    if (a.srcType === \"foundation\" && b.srcType === \"foundation\") {\n        return a.foundationIndex === b.foundationIndex;\n    }\n    return false;\n}\nfunction resetTapState() {\n    lastTapTime = 0;\n    lastTapSrc = null;\n}\n// ========== ルール軽量判定（UI側） ==========\nfunction suitColor(s) {\n    // suitGlyph を使って安全に色を判定（♥♦=赤 / ♠♣=黒）\n    const g = suitGlyph(s);\n    return g === \"♥\" || g === \"♦\" ? \"red\" : \"black\";\n}\n/** テーブルロー上の cardIndex から末尾までが\n *  「1段降順」かつ「色交互」で連続しているなら true（＝ここがドラッグ可能ヘッド）\n */\nfunction isTableauMovableHead(st, colIndex, cardIndex) {\n    const col = st.tableaus[colIndex];\n    const head = col[cardIndex];\n    if (!head || !head.faceUp)\n        return false;\n    for (let i = cardIndex; i < col.length - 1; i++) {\n        const a = col[i];\n        const b = col[i + 1];\n        if (!a.faceUp || !b.faceUp)\n            return false;\n        if (a.rank !== b.rank + 1)\n            return false;\n        if (suitColor(a.suit) === suitColor(b.suit))\n            return false;\n    }\n    return true;\n}\n// ========== 選択中カードの強調判定 ==========\nfunction isHighlighted(ui, kind, pileIdx, cardIdx, pileLen) {\n    const sel = ui.selectedFrom;\n    if (!sel)\n        return false;\n    if (kind === \"tableau\" && sel.srcType === \"tableau\") {\n        // 同じ列で、選択した位置以降の束を全部光らせる\n        return sel.colIndex === pileIdx && cardIdx >= sel.cardIndex;\n    }\n    if (kind === \"waste\" && sel.srcType === \"waste\") {\n        // waste は末尾のみ\n        return cardIdx === pileLen - 1;\n    }\n    if (kind === \"foundation\" && sel.srcType === \"foundation\") {\n        // foundation の一番上だけ\n        return sel.foundationIndex === pileIdx && cardIdx === pileLen - 1;\n    }\n    return false;\n}\n// ========== カードDOM生成（共通） ==========\n// faceUp = true の場合はマーク・ランクを描く\n// faceUp = false の場合は .card.back\nfunction createCardDivCommon(card, highlight, leftPx, topPx, interactiveSrc, handlers, allowAutoToFound, plainClickHandler) {\n    const div = document.createElement(\"div\");\n    if (!card.faceUp) {\n        // 裏向き\n        div.className = \"card back\";\n    }\n    else {\n        // 表向き（色はスート由来で決定）\n        div.className = cardCssClassBySuit(card.suit);\n        const small = document.createElement(\"div\");\n        small.className = \"card-header\";\n        // 左上表示は「スート → ランク」の順\n        small.textContent = suitGlyph(card.suit) + rankToLabel(card.rank);\n        div.appendChild(small);\n        const center = document.createElement(\"div\");\n        center.className = \"card-center\";\n        center.innerHTML = `\n      <span class=\"center-suit\">${suitGlyph(card.suit)}</span>\n      <span class=\"center-rank\">${rankToLabel(card.rank)}</span>\n    `;\n        div.appendChild(center);\n    }\n    if (highlight) {\n        div.classList.add(\"card-selected-outline\");\n    }\n    div.style.position = \"absolute\";\n    div.style.left = `${leftPx}px`;\n    div.style.top = `${topPx}px`;\n    if (card.faceUp && interactiveSrc) {\n        // ---- デスクトップ dblclick ----\n        if (allowAutoToFound) {\n            div.addEventListener(\"dblclick\", (ev) => {\n                ev.stopPropagation();\n                resetTapState();\n                handlers.onAutoToFoundation(interactiveSrc);\n            });\n        }\n        // ---- 単クリック / ダブルタップ（フォールバック） ----\n        div.addEventListener(\"click\", (ev) => {\n            ev.stopPropagation();\n            const now = performance.now();\n            const isDouble = allowAutoToFound && sameSrc(lastTapSrc, interactiveSrc) && now - lastTapTime < 400;\n            if (isDouble) {\n                resetTapState();\n                handlers.onAutoToFoundation(interactiveSrc);\n                return;\n            }\n            // シングル\n            lastTapTime = now;\n            lastTapSrc = interactiveSrc;\n            handlers.onSelectSource(interactiveSrc);\n        });\n        // ---- ドラッグ開始 ----\n        div.addEventListener(\"pointerdown\", (ev) => {\n            ev.stopPropagation();\n            // preventDefault はしない：dblclick殺し防止\n            handlers.onDragStart(interactiveSrc, ev);\n        });\n    }\n    else if (plainClickHandler) {\n        // 束ヘッドでない位置をクリック → 列内の「動かせる束」へスナップ\n        div.addEventListener(\"click\", (ev) => {\n            ev.stopPropagation();\n            // ダブルタップ判定用に“この列”を lastTapSrc に記録（cardIndexは無視される）\n            lastTapTime = performance.now();\n            // plainClick 側では colIndex / cardIndex が分からないので、呼び出し側で設定済みにする\n            plainClickHandler();\n        });\n    }\n    return div;\n}\n// ========== 各エリアDOM生成 ==========\n// STOCK（山札）\nfunction buildStockSlot(st, handlers) {\n    const stockSlot = document.createElement(\"div\");\n    stockSlot.className = \"slot stock-slot\";\n    stockSlot.style.position = \"relative\";\n    stockSlot.dataset.stock = \"1\";\n    // クリックでドロー\n    stockSlot.addEventListener(\"click\", (ev) => {\n        ev.stopPropagation();\n        resetTapState();\n        handlers.onStockClick();\n    });\n    const n = st.stock.length;\n    if (n > 0) {\n        const backDiv = document.createElement(\"div\");\n        backDiv.className = \"card back\";\n        backDiv.style.position = \"absolute\";\n        backDiv.style.left = \"0px\";\n        backDiv.style.top = \"0px\";\n        stockSlot.appendChild(backDiv);\n        const cnt = document.createElement(\"div\");\n        cnt.className = \"stock-count\";\n        cnt.textContent = String(n);\n        stockSlot.appendChild(cnt);\n    }\n    return stockSlot;\n}\n// WASTE（捨て札）\nfunction buildWasteSlot(st, ui, handlers) {\n    const CARD_W = cssPxNumber(\"--card-w\", 72);\n    const WASTE_STEP_X = cssPxNumber(\"--waste-step-x\", 27);\n    const WASTE_STEP_Y = cssPxNumber(\"--waste-step-y\", 4);\n    const WASTE_SCALE = cssNumber(\"--waste-scale\", 0.9);\n    const wasteLen = st.waste.length;\n    const wasteSlot = document.createElement(\"div\");\n    wasteSlot.className = \"slot waste-slot\";\n    wasteSlot.style.position = \"relative\";\n    const widthPx = CARD_W + WASTE_STEP_X * Math.max(0, wasteLen - 1);\n    wasteSlot.style.width = `${widthPx}px`;\n    if (wasteLen === 0) {\n        return wasteSlot;\n    }\n    for (let i = 0; i < wasteLen; i++) {\n        const c = st.waste[i];\n        const isTop = i === wasteLen - 1;\n        const highlight = isHighlighted(ui, \"waste\", 0, i, wasteLen);\n        const srcRef = isTop ? { srcType: \"waste\" } : null;\n        const cardDiv = createCardDivCommon(c, highlight, i * WASTE_STEP_X, WASTE_STEP_Y, srcRef, handlers, \n        /*allowAutoToFound*/ true);\n        cardDiv.style.transform = `scale(${WASTE_SCALE})`;\n        cardDiv.style.transformOrigin = \"top left\";\n        if (isTop && c.faceUp) {\n            cardDiv.dataset.srcType = \"waste\";\n        }\n        wasteSlot.appendChild(cardDiv);\n    }\n    return wasteSlot;\n}\n// FOUNDATION\nfunction buildFoundationGroup(st, ui, handlers) {\n    const foundationGroup = document.createElement(\"div\");\n    foundationGroup.className = \"foundation-group\";\n    for (let fIndex = 0; fIndex < st.foundations.length; fIndex++) {\n        const pile = st.foundations[fIndex];\n        const slot = document.createElement(\"div\");\n        slot.className = \"slot foundation-slot-area\";\n        slot.dataset.drop = `foundation-${fIndex}`;\n        // クリック＝移動先候補通知\n        slot.addEventListener(\"click\", (ev) => {\n            ev.stopPropagation();\n            resetTapState();\n            handlers.onClickDestination({\n                destType: \"foundation\",\n                foundationIndex: fIndex,\n            });\n        });\n        if (pile.length > 0) {\n            const topCard = pile[pile.length - 1];\n            const highlight = isHighlighted(ui, \"foundation\", fIndex, pile.length - 1, pile.length);\n            const srcRef = {\n                srcType: \"foundation\",\n                foundationIndex: fIndex,\n            };\n            const cardDiv = createCardDivCommon(topCard, highlight, 0, 0, srcRef, handlers, \n            /*allowAutoToFound*/ false);\n            cardDiv.classList.add(\"foundation-card\");\n            cardDiv.dataset.srcType = \"foundation\";\n            cardDiv.dataset.foundationIndex = String(fIndex);\n            slot.appendChild(cardDiv);\n        }\n        foundationGroup.appendChild(slot);\n    }\n    return foundationGroup;\n}\n// TABLEAU（場札7列）\nfunction buildTableauArea(st, ui, handlers) {\n    const FACE_GAP = cssPxNumber(\"--gap-faceup\", 24);\n    const BACK_GAP = cssPxNumber(\"--gap-facedown\", 16);\n    const columnsArea = document.createElement(\"div\");\n    columnsArea.className = \"columns-area\";\n    const cols = st.tableaus;\n    for (let ci = 0; ci < cols.length; ci++) {\n        const col = cols[ci];\n        const colStack = document.createElement(\"div\");\n        colStack.className = \"column-stack\";\n        colStack.dataset.drop = `tableau-${ci}`;\n        // 空白クリック＝2タップ目の置き先\n        colStack.addEventListener(\"click\", (ev) => {\n            const t = ev.target;\n            if (t.closest(\".card\"))\n                return;\n            ev.stopPropagation();\n            resetTapState();\n            handlers.onClickDestination({\n                destType: \"tableau\",\n                colIndex: ci,\n            });\n        });\n        let currentTop = 0;\n        for (let pi = 0; pi < col.length; pi++) {\n            const c = col[pi];\n            const highlight = isHighlighted(ui, \"tableau\", ci, pi, col.length);\n            const canDragHead = c.faceUp && isTableauMovableHead(st, ci, pi);\n            const srcRef = {\n                srcType: \"tableau\",\n                colIndex: ci,\n                cardIndex: pi,\n            };\n            const cardDiv = createCardDivCommon(c, highlight, 0, currentTop, canDragHead ? srcRef : null, handlers, \n            /*allowAutoToFound*/ true, \n            // 非ヘッドをクリック → 列内の「実際に動ける束」へスナップ\n            !canDragHead && c.faceUp\n                ? () => {\n                    // 1タップ目としてこの列を記録（cardIndexは sameSrc 判定で無視）\n                    lastTapTime = performance.now();\n                    lastTapSrc = { srcType: \"tableau\", colIndex: ci, cardIndex: pi };\n                    handlers.onColumnCardTap(ci, pi);\n                }\n                : undefined);\n            cardDiv.dataset.srcType = \"tableau\";\n            cardDiv.dataset.colIndex = String(ci);\n            cardDiv.dataset.cardIndex = String(pi);\n            colStack.appendChild(cardDiv);\n            currentTop += c.faceUp ? FACE_GAP : BACK_GAP;\n        }\n        columnsArea.appendChild(colStack);\n    }\n    return columnsArea;\n}\n// ========== メイン描画関数 ==========\nexport function renderKlondikeScreen(rootEl, session, ui, readyForFinish, finishing, gameCleared, handlers) {\n    const st = session.state;\n    rootEl.innerHTML = \"\";\n    // === ルート ===\n    const outer = document.createElement(\"div\");\n    outer.className = \"game-root\";\n    // === board と同じ幅でまとめるフレーム ===\n    const frame = document.createElement(\"div\");\n    frame.className = \"board-frame\";\n    outer.appendChild(frame);\n    // === 上バー（共通コンポーネント） ===\n    const topBar = buildTopBar(session, {\n        statusText: ui.statusText,\n        readyForFinish,\n        finishing,\n        gameCleared,\n    }, {\n        onBackToMenu: () => handlers.onBackToMenu(),\n        onNewGameClick: () => handlers.onNewGameClick(),\n        onUndoClick: () => handlers.onUndoClick(),\n        onFinishClick: () => handlers.onFinishClick(), // KlondikeはFINISH対応\n    });\n    frame.appendChild(topBar);\n    // === 盤面 ===\n    const board = document.createElement(\"div\");\n    board.className = \"board klondike-board\";\n    // 上段: 左(山札) と 右(ファウンデーション)\n    const topRow = document.createElement(\"div\");\n    topRow.className = \"board-top-row\";\n    const leftGroup = document.createElement(\"div\");\n    leftGroup.className = \"stock-waste-group\";\n    leftGroup.appendChild(buildStockSlot(st, handlers));\n    const foundationGroup = buildFoundationGroup(st, ui, handlers);\n    topRow.appendChild(leftGroup);\n    topRow.appendChild(foundationGroup);\n    board.appendChild(topRow);\n    // 中段：ドロー（捨て札）\n    const drawRow = document.createElement(\"div\");\n    drawRow.className = \"draw-row\";\n    drawRow.appendChild(buildWasteSlot(st, ui, handlers));\n    board.appendChild(drawRow);\n    // 下段: tableau（7列）\n    const columnsArea = buildTableauArea(st, ui, handlers);\n    board.appendChild(columnsArea);\n    // 盤面の何もない場所クリックで選択解除（ダブルタップ状態もリセット）\n    board.addEventListener(\"click\", () => {\n        resetTapState();\n        handlers.onEmptyBoardClick();\n    });\n    // 盤面も frame 内に配置\n    frame.appendChild(board);\n    // NEW GAMEオーバーレイ（共通）\n    if (ui.showNewGameMenu && !gameCleared) {\n        outer.appendChild(buildNewGameOverlay({\n            onChooseNewGameOption: handlers.onChooseNewGameOption,\n        }));\n    }\n    // クリアオーバーレイ（共通）\n    if (gameCleared) {\n        outer.appendChild(buildClearOverlay({\n            onClearToMenuClick: handlers.onClearToMenuClick,\n            onClearReplayClick: handlers.onClearReplayClick,\n        }, { titleText: \"CLEAR!\", pulse: true }));\n    }\n    rootEl.appendChild(outer);\n}\n","deps":{"__SOLDEP_0_af1c88d7__":"src/ui/commonUI.js","__SOLDEP_1_e650716__":"src/ui/cardText.js"}},"src/ui/renderSpiderScreen.js":{"src":"// src/ui/renderSpiderScreen.ts\nimport { buildTopBar, buildNewGameOverlay, buildClearOverlay, } from \"__SOLDEP_0_ccae04be__\";\nimport { rankToLabel, suitGlyph, cardCssClassBySuit } from \"__SOLDEP_1_70d38b2f__\";\n/** CSS変数(px)を数値として取得（失敗時は fallback） */\nfunction cssPxNumber(varName, fallback) {\n    const v = getComputedStyle(document.documentElement)\n        .getPropertyValue(varName)\n        .trim();\n    const m = v.match(/^(-?\\d+(?:\\.\\d+)?)px$/);\n    return m ? parseFloat(m[1]) : fallback;\n}\n/** 列の cardIndex から末尾までが\n *  「同スート」かつ「1段降順」で連続しているなら true（＝ここがドラッグ可能ヘッド）\n *  途中に裏面があれば不可\n */\nfunction isSpiderMovableHead(col, cardIndex) {\n    const head = col[cardIndex];\n    if (!head || !head.faceUp)\n        return false;\n    for (let i = cardIndex; i < col.length - 1; i++) {\n        const a = col[i];\n        const b = col[i + 1];\n        if (!a.faceUp || !b.faceUp)\n            return false;\n        if (a.suit !== b.suit)\n            return false;\n        if (a.rank !== b.rank + 1)\n            return false;\n    }\n    return true; // 単独カードもOK\n}\nexport function renderSpiderScreen(rootEl, session, uiState, highlightMap, gameCleared, handlers) {\n    const st = session.state;\n    rootEl.innerHTML = \"\";\n    const outer = document.createElement(\"div\");\n    outer.className = \"game-root\";\n    // board と同じ幅でまとめるフレーム\n    const frame = document.createElement(\"div\");\n    frame.className = \"board-frame\";\n    outer.appendChild(frame);\n    // ===== トップバー（共通） =====\n    const topBar = buildTopBar(session, {\n        statusText: uiState.statusText,\n        // SpiderはFINISH未対応\n        readyForFinish: false,\n        finishing: false,\n        gameCleared: gameCleared || uiState.cleared,\n    }, {\n        onBackToMenu: () => handlers.onBackToMenu(),\n        onNewGameClick: () => handlers.onNewGameClick(),\n        onUndoClick: () => handlers.onUndoClick(),\n        // onFinishClick は渡さない\n    });\n    // トップバーは frame 内（board と同幅）\n    frame.appendChild(topBar);\n    // ===== 盤面全体 =====\n    const board = document.createElement(\"div\");\n    board.className = \"board spider-board\";\n    // 盤面クリックで選択解除（他モードと統一）\n    board.addEventListener(\"click\", () => {\n        handlers.onEmptyBoardClick();\n    });\n    // --- 上段: 山札と完成済みセット数 ---\n    const topRow = document.createElement(\"div\");\n    topRow.className = \"board-top-row\";\n    // 左: stock (山札)\n    {\n        const stockGroup = document.createElement(\"div\");\n        stockGroup.className = \"stock-waste-group\";\n        const stockSlot = document.createElement(\"div\");\n        stockSlot.className = \"slot\";\n        // Spiderのstockはドロップ先にはならないので空\n        stockSlot.dataset.drop = \"\";\n        stockSlot.style.position = \"relative\";\n        stockSlot.style.cursor = \"pointer\";\n        // 残り何回配れるか（stock.length / 10）\n        if (st.stock && st.stock.length > 0) {\n            const remainingDeals = Math.floor(st.stock.length / 10);\n            const badge = document.createElement(\"div\");\n            badge.className = \"stock-count\";\n            // 残回数を「○回」で表示\n            badge.textContent = `${remainingDeals}回`;\n            stockSlot.appendChild(badge);\n        }\n        stockSlot.addEventListener(\"click\", () => {\n            handlers.onStockClick();\n        });\n        stockGroup.appendChild(stockSlot);\n        topRow.appendChild(stockGroup);\n    }\n    // 右: 完成済みセット本数 (completedStacks)\n    {\n        const doneGroup = document.createElement(\"div\");\n        doneGroup.className = \"foundation-group\";\n        const doneSlot = document.createElement(\"div\");\n        doneSlot.className = \"slot spider-done\";\n        doneSlot.style.cursor = \"default\";\n        doneSlot.style.color = \"#00ff9c\";\n        doneSlot.style.fontWeight = \"700\";\n        doneSlot.style.fontSize = \"20px\";\n        doneSlot.style.textAlign = \"center\";\n        // カード高に追従（CSS変数。未設定環境では100px想定）\n        doneSlot.style.lineHeight = \"var(--card-h, 100px)\";\n        // 完成した13～Aセット数を 0/8,1/8,... として出す\n        doneSlot.textContent = `${st.completedStacks}/8`;\n        doneGroup.appendChild(doneSlot);\n        topRow.appendChild(doneGroup);\n    }\n    board.appendChild(topRow);\n    // --- 下段: タブロー10列 ---\n    const columnsArea = document.createElement(\"div\");\n    columnsArea.className = \"columns-area\";\n    // 共通CSS変数に統一\n    const COL_TOP_START = cssPxNumber(\"--column-top-padding\", 4);\n    const FACE_GAP = cssPxNumber(\"--gap-faceup\", 24);\n    const BACK_GAP = cssPxNumber(\"--gap-facedown\", 16);\n    st.columns.forEach((col, colIndex) => {\n        const colWrap = document.createElement(\"div\");\n        colWrap.className = \"column-stack\";\n        // ドロップターゲット認識用\n        colWrap.dataset.drop = `tableau-${colIndex}`;\n        // 列自体の空白クリック\n        colWrap.addEventListener(\"click\", (ev) => {\n            const t = ev.target;\n            if (t.closest(\".card\"))\n                return;\n            // 置き先指定（2タップ目）\n            if (uiState.selectedFrom) {\n                handlers.onClickDestination({\n                    destType: \"tableau\",\n                    colIndex,\n                });\n                return;\n            }\n            // 未選択なら最下段カード位置からのスナップ選択\n            const lastIdx = col.length - 1;\n            if (lastIdx >= 0) {\n                handlers.onColumnCardTap(colIndex, lastIdx);\n            }\n            else {\n                handlers.onEmptyBoardClick();\n            }\n        });\n        // 縦方向オフセット\n        let currentTop = COL_TOP_START;\n        for (let cardIndex = 0; cardIndex < col.length; cardIndex++) {\n            const card = col[cardIndex];\n            const faceUp = card.faceUp;\n            const cardEl = document.createElement(\"div\");\n            if (faceUp) {\n                // 表向き：共通ユーティリティで色クラス付与\n                cardEl.className = cardCssClassBySuit(card.suit);\n            }\n            else {\n                // 裏向き\n                cardEl.className = \"card back\";\n            }\n            cardEl.style.position = \"absolute\";\n            cardEl.style.top = currentTop + \"px\";\n            cardEl.style.left = \"0px\";\n            // この位置がドラッグ可能ヘッドか判定（同スート降順で末尾まで続く）\n            const canDragHead = faceUp && isSpiderMovableHead(col, cardIndex);\n            if (faceUp && canDragHead) {\n                // ドラッグ開始（pointerdown）※ヘッドのみ\n                cardEl.addEventListener(\"pointerdown\", (ev) => {\n                    ev.stopPropagation();\n                    // preventDefault はしない（クリック/ダブルクリックの邪魔をしない）\n                    const srcRef = { srcType: \"tableau\", colIndex, cardIndex };\n                    // pointerdown中に選択処理で再描画すると、押しているカードDOMが消えて\n                    // Spiderだけ直接ドラッグが途切れるため、選択更新はonDragStart側に任せる。\n                    handlers.onDragStart(srcRef, ev);\n                });\n                // ヘッドは通常クリックで選択（スナップ不要）\n                cardEl.addEventListener(\"click\", (ev) => {\n                    ev.stopPropagation();\n                    handlers.onColumnCardTap(colIndex, cardIndex);\n                });\n            }\n            else {\n                // 非ヘッド部をクリックしたら、その列の「実際に動かせる束」をハイライト（FreeCell準拠）\n                cardEl.addEventListener(\"click\", (ev) => {\n                    ev.stopPropagation();\n                    handlers.onColumnCardTap(colIndex, cardIndex);\n                });\n            }\n            // 表向きのカードだけ内容を描画\n            if (faceUp) {\n                const small = document.createElement(\"div\");\n                small.className = \"card-header\";\n                // スート→ランク表示\n                small.textContent = suitGlyph(card.suit) + rankToLabel(card.rank);\n                cardEl.appendChild(small);\n                const center = document.createElement(\"div\");\n                center.className = \"card-center\";\n                center.innerHTML = `\n          <span class=\"center-suit\">${suitGlyph(card.suit)}</span>\n          <span class=\"center-rank\">${rankToLabel(card.rank)}</span>\n        `;\n                cardEl.appendChild(center);\n            }\n            // ハイライト（選択中束に .card-selected-outline を付与）\n            const hlCol = highlightMap.columns[colIndex];\n            if (hlCol && hlCol[cardIndex]) {\n                cardEl.classList.add(\"card-selected-outline\");\n            }\n            colWrap.appendChild(cardEl);\n            // 裏/表でオフセット増分\n            currentTop += faceUp ? FACE_GAP : BACK_GAP;\n        }\n        columnsArea.appendChild(colWrap);\n    });\n    board.appendChild(columnsArea);\n    // board も frame 内に入れる（ヘッダーと同じ幅）\n    frame.appendChild(board);\n    // ===== クリア時オーバーレイ（共通） =====\n    if (gameCleared || uiState.cleared) {\n        outer.appendChild(buildClearOverlay({\n            onClearToMenuClick: handlers.onClearToMenuClick,\n            onClearReplayClick: handlers.onClearReplayClick,\n        }, { titleText: \"クリア！\", pulse: true }));\n    }\n    // ===== NEW GAMEメニューオーバーレイ（共通） =====\n    if (uiState.showNewGameMenu && !uiState.cleared && !gameCleared) {\n        outer.appendChild(buildNewGameOverlay({\n            onChooseNewGameOption: handlers.onChooseNewGameOption,\n        }));\n    }\n    rootEl.appendChild(outer);\n}\n","deps":{"__SOLDEP_0_ccae04be__":"src/ui/commonUI.js","__SOLDEP_1_70d38b2f__":"src/ui/cardText.js"}},"src/ui/renderMenuScreen.js":{"src":"// src/ui/renderMenuScreen.ts\nexport function renderMenuScreen(root, pendingMode, opts, handlers) {\n    root.innerHTML = \"\";\n    const screen = document.createElement(\"div\");\n    screen.className = \"menu-screen\";\n    const title = document.createElement(\"h1\");\n    title.className = \"menu-title\";\n    title.textContent = \"ソリティア\";\n    screen.appendChild(title);\n    const sub = document.createElement(\"div\");\n    sub.className = \"menu-subtitle\";\n    sub.textContent = \"遊びたいゲームを選んでください\";\n    screen.appendChild(sub);\n    if (!pendingMode) {\n        const list = document.createElement(\"div\");\n        list.className = \"menu-list\";\n        for (const [mode, label] of [\n            [\"freecell\", \"フリーセル\"],\n            [\"klondike\", \"クロンダイク\"],\n            [\"spider\", \"スパイダー\"],\n        ]) {\n            const btn = document.createElement(\"button\");\n            btn.className = \"menu-btn active\";\n            btn.textContent = label;\n            btn.addEventListener(\"click\", () => handlers.onSelectMode(mode));\n            list.appendChild(btn);\n        }\n        screen.appendChild(list);\n        const migration = document.createElement(\"div\");\n        migration.className = \"seed-migration-panel\";\n        const migrationTitle = document.createElement(\"div\");\n        migrationTitle.className = \"seed-migration-title\";\n        migrationTitle.textContent = `クリアseed移行・管理（端末内 ${opts.pendingSeedCount}件）`;\n        migration.appendChild(migrationTitle);\n        const migrationButtons = document.createElement(\"div\");\n        migrationButtons.className = \"seed-migration-buttons\";\n        const exportBtn = document.createElement(\"button\");\n        exportBtn.className = \"seed-tool-btn\";\n        exportBtn.textContent = \"書き出し\";\n        exportBtn.disabled = opts.pendingSeedCount <= 0;\n        exportBtn.addEventListener(\"click\", handlers.onExportSeeds);\n        migrationButtons.appendChild(exportBtn);\n        const importBtn = document.createElement(\"button\");\n        importBtn.className = \"seed-tool-btn\";\n        importBtn.textContent = \"読み込み\";\n        importBtn.addEventListener(\"click\", handlers.onImportSeeds);\n        migrationButtons.appendChild(importBtn);\n        const syncBtn = document.createElement(\"button\");\n        syncBtn.className = \"seed-tool-btn\";\n        syncBtn.textContent = \"サーバーへ送信\";\n        syncBtn.disabled = opts.pendingSeedCount <= 0;\n        syncBtn.addEventListener(\"click\", handlers.onSyncSeeds);\n        migrationButtons.appendChild(syncBtn);\n        migration.appendChild(migrationButtons);\n        const migrationDesc = document.createElement(\"div\");\n        migrationDesc.className = \"seed-migration-desc\";\n        migrationDesc.textContent = \"書き出しでは削除されません。新しいGitHub Pagesで読み込んでからサーバーへ送信できます。\";\n        migration.appendChild(migrationDesc);\n        screen.appendChild(migration);\n        if (opts.statusText) {\n            const status = document.createElement(\"div\");\n            status.className = \"seed-sync-status\";\n            status.textContent = opts.statusText;\n            screen.appendChild(status);\n        }\n        root.appendChild(screen);\n        return;\n    }\n    const modeLabel = document.createElement(\"div\");\n    modeLabel.className = \"menu-mode-label\";\n    const labels = { freecell: \"フリーセル\", klondike: \"クロンダイク\", spider: \"スパイダー\" };\n    modeLabel.textContent = `モード: ${labels[pendingMode]}`;\n    screen.appendChild(modeLabel);\n    const guaranteeWrap = document.createElement(\"div\");\n    guaranteeWrap.className = \"guarantee-wrap\";\n    const guaranteeBtn = document.createElement(\"button\");\n    guaranteeBtn.className = `guarantee-toggle ${opts.guaranteeEnabled ? \"on\" : \"off\"}`;\n    guaranteeBtn.textContent = `クリア保証: ${opts.guaranteeEnabled ? \"ON\" : \"OFF\"}`;\n    guaranteeBtn.disabled = !!opts.startBusy;\n    guaranteeBtn.addEventListener(\"click\", handlers.onToggleGuarantee);\n    guaranteeWrap.appendChild(guaranteeBtn);\n    const guaranteeDesc = document.createElement(\"div\");\n    guaranteeDesc.className = \"guarantee-desc\";\n    guaranteeDesc.textContent = opts.guaranteeEnabled\n        ? \"実際にクリア済みのseedから開始します\"\n        : \"通常のランダムseedで開始します\";\n    guaranteeWrap.appendChild(guaranteeDesc);\n    screen.appendChild(guaranteeWrap);\n    const levelList = document.createElement(\"div\");\n    levelList.className = \"menu-list\";\n    for (const level of [1, 2, 3]) {\n        const b = document.createElement(\"button\");\n        b.className = \"menu-btn active\";\n        b.textContent = `レベル${level}`;\n        b.disabled = !!opts.startBusy;\n        b.addEventListener(\"click\", () => handlers.onStartGame(pendingMode, level));\n        levelList.appendChild(b);\n    }\n    screen.appendChild(levelList);\n    if (opts.statusText) {\n        const status = document.createElement(\"div\");\n        status.className = \"seed-sync-status\";\n        status.textContent = opts.statusText;\n        screen.appendChild(status);\n    }\n    if (opts.pendingSeedCount > 0) {\n        const pending = document.createElement(\"div\");\n        pending.className = \"seed-sync-note\";\n        pending.textContent = `未送信クリアseed: ${opts.pendingSeedCount}件`;\n        screen.appendChild(pending);\n    }\n    const backBtn = document.createElement(\"button\");\n    backBtn.className = \"menu-back-btn\";\n    backBtn.textContent = \"← ゲーム選択に戻る\";\n    backBtn.disabled = !!opts.startBusy;\n    backBtn.addEventListener(\"click\", handlers.onBackModeSelect);\n    screen.appendChild(backBtn);\n    root.appendChild(screen);\n}\n","deps":{}},"src/services/clearSeedStore.js":{"src":"// V1 は旧公開版の形式。V2 では dealVersion を追加する。\n// V1: V1,ts_ms,modeId,level,seed,moves,dur_ms\n// V2: V2,ts_ms,modeId,level,seed,dealVersion,moves,dur_ms\nconst CLEAR_LOG_KEY = \"ClearSeedLogV2\";\nconst LEGACY_CLEAR_LOG_KEY = \"ClearSeedLogV1\";\nconst CLEAR_LOG_MAX_BYTES = 4_500_000;\nlet clearLogMigrationChecked = false;\nfunction modeToId(mode) {\n    return mode === \"freecell\" ? 0 : mode === \"klondike\" ? 1 : 2;\n}\nfunction idToMode(modeId) {\n    return modeId === 0 ? \"freecell\" : modeId === 1 ? \"klondike\" : \"spider\";\n}\nfunction identityOfStored(rec) {\n    return `${rec.modeId}|${rec.level}|${rec.seed >>> 0}|${rec.dealVersion}`;\n}\nexport function clearSeedIdentity(rec) {\n    return `${modeToId(rec.mode)}|${rec.level}|${rec.seed >>> 0}|${rec.dealVersion}`;\n}\nfunction parseStoredLine(line) {\n    const p = line.trim().split(\",\");\n    if (p[0] === \"V1\" && p.length >= 7) {\n        const [tsMs, modeId, level, seed, moves, durMs] = p.slice(1, 7).map(Number);\n        if (![tsMs, modeId, level, seed, moves, durMs].every(Number.isFinite))\n            return null;\n        if (modeId < 0 || modeId > 2)\n            return null;\n        return {\n            tsMs,\n            modeId: modeId,\n            level,\n            seed: seed >>> 0,\n            dealVersion: 1,\n            moves,\n            durMs,\n        };\n    }\n    if (p[0] === \"V2\" && p.length >= 8) {\n        const [tsMs, modeId, level, seed, dealVersion, moves, durMs] = p.slice(1, 8).map(Number);\n        if (![tsMs, modeId, level, seed, dealVersion, moves, durMs].every(Number.isFinite))\n            return null;\n        if (modeId < 0 || modeId > 2)\n            return null;\n        return {\n            tsMs,\n            modeId: modeId,\n            level,\n            seed: seed >>> 0,\n            dealVersion,\n            moves,\n            durMs,\n        };\n    }\n    return null;\n}\nfunction formatStoredV2(rec) {\n    return [\n        \"V2\",\n        rec.tsMs,\n        rec.modeId,\n        rec.level | 0,\n        rec.seed >>> 0,\n        rec.dealVersion | 0,\n        rec.moves | 0,\n        rec.durMs | 0,\n    ].join(\",\");\n}\nfunction migrateLegacyClearLogIfNeeded() {\n    if (clearLogMigrationChecked)\n        return;\n    clearLogMigrationChecked = true;\n    try {\n        const current = localStorage.getItem(CLEAR_LOG_KEY) || \"\";\n        const legacy = localStorage.getItem(LEGACY_CLEAR_LOG_KEY) || \"\";\n        if (!legacy.trim())\n            return;\n        const byId = new Map();\n        for (const line of `${current}\\n${legacy}`.split(\"\\n\")) {\n            const rec = parseStoredLine(line);\n            if (!rec)\n                continue;\n            const id = identityOfStored(rec);\n            const prev = byId.get(id);\n            if (!prev || rec.tsMs > prev.tsMs)\n                byId.set(id, rec);\n        }\n        const merged = Array.from(byId.values())\n            .sort((a, b) => a.tsMs - b.tsMs)\n            .map(formatStoredV2);\n        if (merged.length) {\n            localStorage.setItem(CLEAR_LOG_KEY, merged.join(\"\\n\") + \"\\n\");\n            localStorage.removeItem(LEGACY_CLEAR_LOG_KEY);\n        }\n    }\n    catch {\n        // localStorage が使えない環境では何もしない。\n    }\n}\nfunction readRaw() {\n    try {\n        migrateLegacyClearLogIfNeeded();\n        return localStorage.getItem(CLEAR_LOG_KEY) || \"\";\n    }\n    catch {\n        return \"\";\n    }\n}\nfunction writeRaw(value) {\n    try {\n        localStorage.setItem(CLEAR_LOG_KEY, value);\n        return true;\n    }\n    catch {\n        return false;\n    }\n}\nfunction pruneIfNeeded() {\n    const raw = readRaw();\n    if (raw.length <= CLEAR_LOG_MAX_BYTES)\n        return;\n    const lines = raw.split(\"\\n\").filter(Boolean);\n    const newerHalf = lines.slice(Math.floor(lines.length / 2)).join(\"\\n\");\n    writeRaw(newerHalf ? newerHalf + \"\\n\" : \"\");\n}\nfunction toStored(rec) {\n    return {\n        tsMs: rec.tsMs,\n        modeId: modeToId(rec.mode),\n        level: rec.level,\n        seed: rec.seed >>> 0,\n        dealVersion: rec.dealVersion,\n        moves: rec.moves,\n        durMs: rec.durMs,\n    };\n}\nfunction fromStored(rec) {\n    return {\n        tsMs: rec.tsMs,\n        mode: idToMode(rec.modeId),\n        level: rec.level,\n        seed: rec.seed >>> 0,\n        dealVersion: rec.dealVersion,\n        moves: rec.moves,\n        durMs: rec.durMs,\n    };\n}\n/**\n * 未送信のクリア済みシードを追加する。\n * 同じ game + level + seed + dealVersion は1件だけ保持する。\n */\nexport function enqueueClearedSeed(rec) {\n    const stored = toStored(rec);\n    const id = identityOfStored(stored);\n    const raw = readRaw();\n    for (const line of raw.split(\"\\n\")) {\n        const existing = parseStoredLine(line);\n        if (existing && identityOfStored(existing) === id)\n            return \"duplicate\";\n    }\n    const newLine = formatStoredV2(stored);\n    const base = raw && !raw.endsWith(\"\\n\") ? raw + \"\\n\" : raw;\n    if (writeRaw(base + newLine + \"\\n\")) {\n        pruneIfNeeded();\n        return \"added\";\n    }\n    // 容量上限で書けなかった場合は、古い半分を落として「今回のクリア」を優先して再試行。\n    const oldLines = raw.split(\"\\n\").filter(Boolean);\n    const newerHalf = oldLines.slice(Math.floor(oldLines.length / 2));\n    const retryRaw = [...newerHalf, newLine].join(\"\\n\") + \"\\n\";\n    return writeRaw(retryRaw) ? \"added\" : \"storage-error\";\n}\n/** サーバーへ送る対象。古い順で返す。 */\nexport function listPendingClearedSeeds() {\n    const byId = new Map();\n    for (const line of readRaw().split(\"\\n\")) {\n        const rec = parseStoredLine(line);\n        if (!rec)\n            continue;\n        const id = identityOfStored(rec);\n        const prev = byId.get(id);\n        if (!prev || rec.tsMs > prev.tsMs)\n            byId.set(id, rec);\n    }\n    return Array.from(byId.values())\n        .sort((a, b) => a.tsMs - b.tsMs)\n        .map(fromStored);\n}\n/**\n * サーバー登録に成功したIDだけローカル保留キューから削除する。\n * 返り値は削除件数。\n */\nexport function removePendingClearedSeeds(identities) {\n    const targets = new Set(identities);\n    if (!targets.size)\n        return 0;\n    const kept = [];\n    let removed = 0;\n    for (const line of readRaw().split(\"\\n\")) {\n        const rec = parseStoredLine(line);\n        if (!rec)\n            continue;\n        if (targets.has(identityOfStored(rec))) {\n            removed++;\n        }\n        else {\n            kept.push(formatStoredV2(rec));\n        }\n    }\n    writeRaw(kept.length ? kept.join(\"\\n\") + \"\\n\" : \"\");\n    return removed;\n}\nfunction normalizeImportRecord(value) {\n    if (!value || typeof value !== \"object\")\n        return null;\n    const v = value;\n    const mode = v.mode;\n    const level = Number(v.level);\n    const seed = Number(v.seed);\n    const dealVersion = Number(v.dealVersion ?? 1);\n    const tsMs = Number(v.tsMs ?? Date.now());\n    const moves = Number(v.moves ?? 0);\n    const durMs = Number(v.durMs ?? 0);\n    if (mode !== \"freecell\" && mode !== \"klondike\" && mode !== \"spider\")\n        return null;\n    if (!Number.isInteger(level) || level < 1 || level > 3)\n        return null;\n    if (!Number.isFinite(seed) || seed < 0 || seed > 0xffffffff)\n        return null;\n    if (!Number.isInteger(dealVersion) || dealVersion < 1)\n        return null;\n    if (![tsMs, moves, durMs].every(Number.isFinite))\n        return null;\n    return {\n        tsMs: Math.max(0, Math.trunc(tsMs)),\n        mode,\n        level,\n        seed: seed >>> 0,\n        dealVersion,\n        moves: Math.max(0, Math.trunc(moves)),\n        durMs: Math.max(0, Math.trunc(durMs)),\n    };\n}\n/**\n * GitHub Pages のアカウント/ドメイン移行用バックアップ。\n * 書き出しても端末内の未送信seedは削除しない。\n */\nexport function exportClearedSeedBackupText() {\n    const records = listPendingClearedSeeds();\n    const backup = {\n        format: \"solitaire-clear-seeds\",\n        version: 1,\n        exportedAt: new Date().toISOString(),\n        recordCount: records.length,\n        records,\n    };\n    return JSON.stringify(backup, null, 2) + \"\\n\";\n}\n/**\n * 新しいGitHub Pages側へバックアップを取り込む。\n * JSONバックアップのほか、旧V1/V2の生ログ貼り付け/テキストも受け付ける。\n */\nexport function importClearedSeedBackupText(text) {\n    const result = { total: 0, added: 0, duplicates: 0, invalid: 0 };\n    const trimmed = text.trim();\n    if (!trimmed)\n        return result;\n    let candidates = null;\n    try {\n        const parsed = JSON.parse(trimmed);\n        if (Array.isArray(parsed)) {\n            candidates = parsed;\n        }\n        else if (parsed && typeof parsed === \"object\") {\n            const obj = parsed;\n            if (obj.format === \"solitaire-clear-seeds\" && Number(obj.version) === 1 && Array.isArray(obj.records)) {\n                candidates = obj.records;\n            }\n        }\n    }\n    catch {\n        // JSONでなければ旧V1/V2の行形式として下で処理する。\n    }\n    if (candidates) {\n        for (const value of candidates) {\n            result.total++;\n            const rec = normalizeImportRecord(value);\n            if (!rec) {\n                result.invalid++;\n                continue;\n            }\n            const added = enqueueClearedSeed(rec);\n            if (added === \"added\")\n                result.added++;\n            else if (added === \"duplicate\")\n                result.duplicates++;\n            else\n                result.invalid++;\n        }\n        return result;\n    }\n    for (const line of trimmed.split(/\\r?\\n/)) {\n        if (!line.trim())\n            continue;\n        result.total++;\n        const stored = parseStoredLine(line);\n        if (!stored) {\n            result.invalid++;\n            continue;\n        }\n        const added = enqueueClearedSeed(fromStored(stored));\n        if (added === \"added\")\n            result.added++;\n        else if (added === \"duplicate\")\n            result.duplicates++;\n        else\n            result.invalid++;\n    }\n    return result;\n}\n","deps":{}},"src/config.js":{"src":"/**\n * Cloudflare Worker の公開URL。\n * Worker名を変更した場合だけここを変更する。\n */\nexport const CLEAR_SEED_API_URL = \"https://solitaire-seed-api.naitoryo7110.workers.dev\";\n","deps":{}},"src/services/clearSeedApi.js":{"src":"import { CLEAR_SEED_API_URL } from \"__SOLDEP_0_fde31d8__\";\nimport { clearSeedIdentity, listPendingClearedSeeds, removePendingClearedSeeds, } from \"__SOLDEP_1_73d76c0a__\";\nconst REQUEST_TIMEOUT_MS = 10_000;\nconst MAX_BATCH_SIZE = 200;\nasync function fetchJson(path, init) {\n    const controller = new AbortController();\n    const timer = window.setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);\n    try {\n        const res = await fetch(`${CLEAR_SEED_API_URL}${path}`, {\n            ...init,\n            signal: controller.signal,\n            headers: {\n                \"Content-Type\": \"application/json\",\n                ...(init?.headers || {}),\n            },\n        });\n        const body = await res.json().catch(() => null);\n        if (!res.ok) {\n            const msg = body?.error || `HTTP ${res.status}`;\n            throw new Error(msg);\n        }\n        return body;\n    }\n    finally {\n        window.clearTimeout(timer);\n    }\n}\n/**\n * ローカル未送信キューをサーバーへ送る。\n * サーバー側に既に存在していたseedも「登録済み」とみなし、ローカルから削除する。\n */\nexport async function flushPendingClearedSeeds() {\n    let sent = 0;\n    let removed = 0;\n    while (true) {\n        const pending = listPendingClearedSeeds();\n        if (!pending.length)\n            break;\n        const batch = pending.slice(0, MAX_BATCH_SIZE);\n        const body = await fetchJson(\"/api/clear-seeds/batch\", {\n            method: \"POST\",\n            body: JSON.stringify({ records: batch }),\n        });\n        const accepted = Array.isArray(body?.acceptedIdentities)\n            ? body.acceptedIdentities.filter((v) => typeof v === \"string\")\n            : [];\n        if (!accepted.length) {\n            throw new Error(\"サーバーが登録済みseedを返しませんでした\");\n        }\n        sent += batch.length;\n        const removedThisBatch = removePendingClearedSeeds(accepted);\n        removed += removedThisBatch;\n        // 正常応答なのに1件もローカルから減らない場合は無限ループを防止。\n        if (removedThisBatch === 0 && listPendingClearedSeeds().length >= pending.length) {\n            throw new Error(\"クリアseed同期が進みませんでした\");\n        }\n    }\n    return {\n        sent,\n        removed,\n        remaining: listPendingClearedSeeds().length,\n    };\n}\n/** game + level + dealVersion に一致する、実際にクリア済みのseedを1件取得する。 */\nexport async function fetchGuaranteedSeed(mode, level, dealVersion) {\n    const q = new URLSearchParams({\n        mode,\n        level: String(level | 0),\n        dealVersion: String(dealVersion | 0),\n    });\n    const body = await fetchJson(`/api/clear-seeds/random?${q.toString()}`, {\n        method: \"GET\",\n    });\n    if (body?.seed === null || body?.seed === undefined)\n        return null;\n    const seed = Number(body.seed);\n    const count = Number(body.count || 0);\n    if (!Number.isFinite(seed))\n        throw new Error(\"不正なseed応答です\");\n    return {\n        seed: seed >>> 0,\n        count: Number.isFinite(count) ? count | 0 : 0,\n    };\n}\nexport function pendingClearSeedCount() {\n    return listPendingClearedSeeds().length;\n}\nexport function identityForRecord(rec) {\n    return clearSeedIdentity(rec);\n}\n","deps":{"__SOLDEP_0_fde31d8__":"src/config.js","__SOLDEP_1_73d76c0a__":"src/services/clearSeedStore.js"}},"src/services/clearGuaranteeSetting.js":{"src":"const KEY = \"ClearGuaranteeEnabledV1\";\nexport function loadClearGuaranteeEnabled() {\n    try {\n        return localStorage.getItem(KEY) === \"1\";\n    }\n    catch {\n        return false;\n    }\n}\nexport function saveClearGuaranteeEnabled(enabled) {\n    try {\n        localStorage.setItem(KEY, enabled ? \"1\" : \"0\");\n    }\n    catch {\n        // localStorage が使えない環境では、そのセッション中だけ状態を保持する。\n    }\n}\n","deps":{}},"src/main.js":{"src":"// src/main.ts\nimport { ZoomControls } from \"__SOLDEP_0_e7416815__\"; // ★ズームUI\nimport { createDnD, findDropElementAtPoint, buildStackGhostFromClickedCard } from \"__SOLDEP_1_7af60040__\"; // ★D&D共通コア\nimport { GameSession } from \"__SOLDEP_2_6aaaa1e3__\";\n// ===== FreeCell側 =====\nimport { applyMoveBundle as applyMoveBundleFreecell, } from \"__SOLDEP_3_a381083b__\";\nimport { calcMaxMovableLen, getStackFromColumn, canPlaceOnFoundation as canPlaceOnFoundationFC, suitToFoundationIndex as suitToFoundationIndexFC } from \"__SOLDEP_4_7bdc21a8__\";\nimport { renderGameScreen, } from \"__SOLDEP_5_d2fdae3f__\";\n// ===== Klondike側 =====\nimport { applyMoveBundleKlondike, // ← 修正\ngetMovableStackFromTableau } from \"__SOLDEP_6_5e00375b__\";\nimport { renderKlondikeScreen } from \"__SOLDEP_7_5cf8be41__\";\n// ===== Spider側 =====\nimport { renderSpiderScreen, } from \"__SOLDEP_8_6dae7351__\";\n// ===== メニュー =====\nimport { renderMenuScreen } from \"__SOLDEP_9_5395d285__\";\nimport { enqueueClearedSeed, exportClearedSeedBackupText, importClearedSeedBackupText, } from \"__SOLDEP_10_31cd960d__\";\nimport { fetchGuaranteedSeed, flushPendingClearedSeeds, pendingClearSeedCount, } from \"__SOLDEP_11_40bbe66d__\";\nimport { loadClearGuaranteeEnabled, saveClearGuaranteeEnabled, } from \"__SOLDEP_12_ec47bf1d__\";\nimport { getDealVersion } from \"__SOLDEP_13_1b213f00__\";\n// -------------------------------------------------\n// デバッグユーティリティ\n// -------------------------------------------------\nconst DEBUG = true;\nconst t0 = performance.now();\nconst ts = () => (performance.now() - t0).toFixed(1);\nconst log = (...args) => { if (DEBUG)\n    console.log(...args); };\n// -------------------------------------------------\n// 画面・セッション\n// -------------------------------------------------\nlet screen = \"menu\";\nlet pendingMode = undefined;\nlet session = null;\nlet clearGuaranteeEnabled = loadClearGuaranteeEnabled();\nlet menuNetworkStatus = \"\";\nlet startBusy = false;\nlet seedSyncInFlight = false;\nlet currentSeedSource = \"random\";\nlet uiState = {\n    selectedFrom: undefined,\n    statusText: \"\",\n    cleared: false,\n    showNewGameMenu: false,\n};\n// FINISH中（freecell/klondike用）※spiderは使わない\nlet finishing = false;\nlet finishTimer = null;\n// -------------------------------------------------\n// 見た目用ユーティリティ\n// -------------------------------------------------\nfunction rankToLabel(rank) {\n    if (rank === 1)\n        return \"A\";\n    if (rank === 11)\n        return \"J\";\n    if (rank === 12)\n        return \"Q\";\n    if (rank === 13)\n        return \"K\";\n    return String(rank);\n}\nfunction suitGlyph(suit) {\n    switch (suit) {\n        case \"H\": return \"♥\";\n        case \"D\": return \"♦\";\n        case \"C\": return \"♣\";\n        case \"S\": return \"♠\";\n    }\n    return \"\";\n}\nfunction getColorBySuit(s) {\n    return s === \"H\" || s === \"D\" ? \"red\" : \"black\";\n}\n// 共通：カード表記（スート→ランク）\nfunction cardLabelGeneric(card) {\n    if (!card)\n        return \"\";\n    return `${suitGlyph(card.suit)}${rankToLabel(card.rank)}`;\n}\n// ===== 選択中カード取得（表示用） =====\nfunction getSelectedHeadCardFreecell(st, src) {\n    if (src.srcType === \"column\") {\n        const col = st.columns[src.colIndex];\n        if (!col?.length)\n            return null;\n        return col[src.startIndex];\n    }\n    else if (src.srcType === \"freecell\") {\n        return st.freecells[src.freecellIndex] || null;\n    }\n    else {\n        const pile = st.foundations[src.foundationIndex];\n        if (!pile?.length)\n            return null;\n        return pile[pile.length - 1];\n    }\n}\nfunction getSelectedHeadCardKlondike(st, src) {\n    if (src.srcType === \"tableau\") {\n        const col = st.tableaus[src.colIndex];\n        if (!col?.length)\n            return null;\n        return col[src.cardIndex];\n    }\n    else if (src.srcType === \"waste\") {\n        const w = st.waste;\n        return w?.length ? w[w.length - 1] : null;\n    }\n    else {\n        const f = st.foundations[src.foundationIndex];\n        return f?.length ? f[f.length - 1] : null;\n    }\n}\nfunction getSelectedHeadCardSpider(st, src) {\n    if (src.srcType !== \"tableau\")\n        return null;\n    const col = st.columns[src.colIndex];\n    if (!col?.length)\n        return null;\n    return col[src.cardIndex];\n}\n// -------------------------------------------------\n// FreeCell専用ユーティリティ\n// -------------------------------------------------\nfunction cloneStateFC(state) {\n    return {\n        columns: state.columns.map(col => col.slice()),\n        freecells: state.freecells.slice(),\n        foundations: state.foundations.map(p => p.slice())\n    };\n}\nfunction isFullyClearedFreecell(state) {\n    let total = 0;\n    for (let i = 0; i < state.foundations.length; i++) {\n        total += state.foundations[i].length;\n    }\n    return total === 52;\n}\nfunction safeToAutoPlayCard_FC(card, foundations) {\n    const heights = {\n        H: foundations[0].length,\n        D: foundations[1].length,\n        C: foundations[2].length,\n        S: foundations[3].length\n    };\n    const r = card.rank;\n    if (r <= 2)\n        return true; // A,2\n    if (card.color === \"red\") {\n        const minBlack = Math.min(heights.S, heights.C);\n        return r <= minBlack + 1;\n    }\n    else {\n        const minRed = Math.min(heights.H, heights.D);\n        return r <= minRed + 1;\n    }\n}\nfunction canClearByFoundationOnlyFreecell(state) {\n    const sim = cloneStateFC(state);\n    while (true) {\n        let movedThisLoop = false;\n        for (let fi = 0; fi < sim.freecells.length; fi++) {\n            const card = sim.freecells[fi];\n            if (!card)\n                continue;\n            if (canPlaceOnFoundationFC(sim, card) &&\n                safeToAutoPlayCard_FC(card, sim.foundations)) {\n                sim.freecells[fi] = null;\n                sim.foundations[suitToFoundationIndexFC(card.suit)].push(card);\n                movedThisLoop = true;\n                break;\n            }\n        }\n        if (movedThisLoop)\n            continue;\n        for (let ci = 0; ci < sim.columns.length; ci++) {\n            const col = sim.columns[ci];\n            if (!col.length)\n                continue;\n            const card = col[col.length - 1];\n            if (canPlaceOnFoundationFC(sim, card) &&\n                safeToAutoPlayCard_FC(card, sim.foundations)) {\n                col.pop();\n                sim.foundations[suitToFoundationIndexFC(card.suit)].push(card);\n                movedThisLoop = true;\n                break;\n            }\n        }\n        if (!movedThisLoop)\n            break;\n    }\n    return isFullyClearedFreecell(sim);\n}\nfunction autoSweepSafeStepFreecell() {\n    if (!session)\n        return false;\n    const st = session.state;\n    for (let fi = 0; fi < st.freecells.length; fi++) {\n        const card = st.freecells[fi];\n        if (!card)\n            continue;\n        if (canPlaceOnFoundationFC(st, card) &&\n            safeToAutoPlayCard_FC(card, st.foundations)) {\n            const src = { srcType: \"freecell\", freecellIndex: fi };\n            const ok = tryMoveByRefsFreecell(src, { destType: \"foundation\" });\n            if (ok.ok)\n                return true;\n        }\n    }\n    for (let ci = 0; ci < st.columns.length; ci++) {\n        const col = st.columns[ci];\n        if (!col.length)\n            continue;\n        const card = col[col.length - 1];\n        if (canPlaceOnFoundationFC(st, card) &&\n            safeToAutoPlayCard_FC(card, st.foundations)) {\n            const src = {\n                srcType: \"column\",\n                colIndex: ci,\n                startIndex: col.length - 1\n            };\n            const ok = tryMoveByRefsFreecell(src, { destType: \"foundation\" });\n            if (ok.ok)\n                return true;\n        }\n    }\n    return false;\n}\nfunction uiFromRefToPileRef_FC(src) {\n    if (src.srcType === \"column\") {\n        return {\n            type: \"column\",\n            index: src.colIndex,\n            startIndex: src.startIndex\n        };\n    }\n    if (src.srcType === \"freecell\") {\n        return {\n            type: \"freecell\",\n            index: src.freecellIndex\n        };\n    }\n    return {\n        type: \"foundation\",\n        index: src.foundationIndex\n    };\n}\nfunction uiDestRefToPileRef_FC(dest) {\n    if (dest.destType === \"column\") {\n        return { type: \"column\", index: dest.colIndex };\n    }\n    if (dest.destType === \"freecell\") {\n        return { type: \"freecell\", index: dest.freecellIndex };\n    }\n    return { type: \"foundation\", index: dest.foundationIndex };\n}\nfunction tryMoveByRefsFreecell(src, dest) {\n    if (!session)\n        return { ok: false, reason: \"no session\" };\n    // ★ 同じ場所へのドロップはキャンセル扱い\n    if (src.srcType === \"column\" &&\n        dest.destType === \"column\" &&\n        src.colIndex === dest.colIndex) {\n        uiState.selectedFrom = undefined;\n        uiState.statusText = \"選択解除\";\n        rerender();\n        return { ok: false, reason: \"same column tStackFromColumn(state, src.colIndex, src.startIndex);\n        if (!seqFull.length)\n            return [];\n        const maxLen = calcMaxMovableLen(state);\n        if (seqFull.length > maxLen)\n            return [];\n        return seqFull;\n    }\n    if (src.srcType === \"freecell\") {\n        const c = state.freecells[src.freecellIndex];\n        return c ? [c] : [];\n    }\n    if (src.srcType === \"foundation\") {\n        const pile = state.foundations[src.foundationIndex];\n        if (!pile.length)\n            return [];\n        return [pile[pile.length - 1]];\n    }\n    return [];\n}\n// -------------------------------------------------\n// Klondike専用ユーティリティ\n// -------------------------------------------------\nfunction isFaceUpK(card) {\n    return !!card.faceUp;\n}\nfunction uiFromRefToPileRef_K(src) {\n    if (src.srcType === \"tableau\") {\n        return {\n            type: \"tableau\",\n            colIndex: src.colIndex,\n            cardIndex: src.cardIndex\n        };\n    }\n    if (src.srcType === \"waste\") {\n        return { type: \"waste\" };\n    }\n    return { type: \"foundation\", foundationIndex: src.foundationIndex };\n}\nfunction uiDestRefToPileRef_K(dest) {\n    if (dest.destType === \"tableau\") {\n        return { type: \"tableau\", colIndex: dest.colIndex };\n    }\n    return {\n        type: \"foundation\",\n        foundationIndex: dest.foundationIndex\n    };\n}\nfunction tryMoveByRefsKlondike(src, dest) {\n    if (!session)\n        return { ok: false, reason: \"no session\" };\n    // ★ 同じ場所へのドロップはキャンセル扱い\n    if (src.srcType === \"tableau\" &&\n        dest.destType === \"tableau\" &&\n        src.colIndex === dest.colIndex) {\n        uiState.selectedFrom = undefined;\n        uiState.statusText = \"選択解除\";\n        rerender();\n        return { ok: false, reason: \"same tableau\" };\n    }\n    if (src.srcType === \"foundation\" &&\n        dest.destType === \"foundation\" &&\n        src.foundationIndex === des
